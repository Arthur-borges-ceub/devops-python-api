name: CI - Integracao Continua

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Qualidade e Testes (Ruff e Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências da aplicação e de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Executar análise estática (Ruff Check)
        run: ruff check .

      - name: Verificar formatação do código (Ruff Format)
        run: ruff format --check .

      - name: Executar testes automatizados com pytest e cobertura
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=reports/junit.xml

      - name: Salvar relatórios de execução de testes como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: error
          retention-days: 7

  container-smoke-test:
    name: Build e Teste do Contêiner Docker
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Construir a imagem Docker
        run: docker build --tag devops-python-api:${{ github.sha }} .

      - name: Iniciar contêiner em segundo plano
        run: |
          docker run \
            --detach \
            --name devops-python-api \
            --publish 8000:8000 \
            devops-python-api:${{ github.sha }}

      - name: Verificar funcionamento da API no endpoint /health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo "API inicializada e respondendo com sucesso!"
              exit 0
            fi
            echo "Tentativa ${attempt}: API ainda não está pronta, aguardando..."
            sleep 1
          done
          echo "Erro: Tempo limite atingido sem resposta da API."
          exit 1

      - name: Exibir logs do contêiner para diagnóstico
        if: always()
        run: docker logs devops-python-api

      - name: Remover contêiner temporário
        if: always()
        run: docker rm --force devops-python-api
