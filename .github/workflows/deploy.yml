name: CD - Entrega Continua AWS (ECR e EC2)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 1. Executar Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Verificar análise estática (Ruff Check)
        run: ruff check .

      - name: Verificar formatação (Ruff Format)
        run: ruff format --check .

      - name: Executar testes automatizados (pytest)
        run: pytest -v

  build-and-push:
    name: 2. Construir e Publicar Imagem no Amazon ECR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Realizar login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir, identificar e enviar imagem ao Amazon ECR
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Construindo imagem Docker..."
          docker build \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          echo "Publicando imagem no Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-ec2:
    name: 3. Implantação Automatizada na Instância EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Estabelecer conexão SSH e executar Deploy na EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=================================================="
            echo "   INICIANDO IMPLANTAÇÃO AUTOMATIZADA NA EC2      "
            echo "=================================================="

            REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
            REPOSITORY="${{ secrets.ECR_REPOSITORY }}"
            IMAGE_TAG="${{ github.sha }}"
            FULL_IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

            echo ">> 1. Autenticando o Docker da instância no Amazon ECR via IAM Role..."
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY

            echo ">> 2. Baixando a imagem da nova versão: $FULL_IMAGE..."
            docker pull $FULL_IMAGE

            echo ">> 3. Substituindo o contêiner anterior..."
            if [ "$(docker ps -aq -f name=devops-python-api)" ]; then
              docker stop devops-python-api || true
              docker rm devops-python-api || true
            fi

            echo ">> 4. Iniciando a aplicação atualizada..."
            docker run -d \
              --name devops-python-api \
              --restart unless-stopped \
              -p 8000:8000 \
              $FULL_IMAGE

            echo ">> 5. Verificando integridade e funcionamento da aplicação..."
            sleep 5
            docker ps -f name=devops-python-api

            echo ">> 6. Executando teste de saúde (Healthcheck HTTP)..."
            curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health

            echo ">> 7. Limpando imagens antigas e não utilizadas..."
            docker image prune -af || true

            echo "=================================================="
            echo "       IMPLANTAÇÃO CONCLUÍDA COM SUCESSO!         "
            echo "=================================================="
