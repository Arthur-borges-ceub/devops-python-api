name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest
        run: |
          pytest -v

  build-and-deploy:
    name: Build, Publish to ECR & Deploy to EC2
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Construindo imagem Docker..."
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          echo "Enviando imagens para o Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Amazon EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        script: |
          set -e
          echo "=========================================================="
          echo "Iniciando processo de deploy na instancia Amazon EC2"
          echo "=========================================================="

          echo "[1/6] Autenticando Docker no Amazon ECR via IAM Role da EC2..."
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

          echo "[2/6] Baixando a nova imagem correspondente ao commit ($IMAGE_TAG)..."
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "[3/6] Interrompendo e removendo versao anterior do container..."
          docker stop devops-python-api || true
          docker rm devops-python-api || true

          echo "[4/6] Executando novo container na porta 80..."
          docker run -d \
            --name devops-python-api \
            --restart always \
            -p 80:5000 \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "[5/6] Aguardando inicializacao e verificando container..."
          sleep 5
          docker ps -f name=devops-python-api

          echo "[6/6] Realizando verificacao de saude local (Healthcheck)..."
          curl -f http://localhost:80/health || (echo "Healthcheck falhou!" && exit 1)

          echo "Limpando imagens antigas..."
          docker image prune -f || true

          echo "=========================================================="
          echo "Deploy realizado com sucesso! Versao ativa: $IMAGE_TAG"
          echo "=========================================================="
